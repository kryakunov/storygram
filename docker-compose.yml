services:
  postgres:
    image: postgres:16-alpine
    container_name: public-story-viewer-db
    environment:
      POSTGRES_USER: storyviewer
      POSTGRES_PASSWORD: storyviewer
      POSTGRES_DB: storyviewer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyviewer -d storyviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: public-story-viewer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
